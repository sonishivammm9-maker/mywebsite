<!DOCTYPE html>
<html>
<head>
  <title>My Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">MyStore</div>
  <input class="search" placeholder="Search products">
  <a class="login" href="admin.html">Admin</a>
</div>

<!-- CATEGORIES -->
<div class="categories">
  <div>Men</div>
  <div>Women</div>
  <div>Kids</div>
  <div>Sale</div>
</div>

<!-- PRODUCTS -->
<div class="products">

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Men T-Shirt</h3>
    <p class="price">₹499 <span>₹999</span></p>
    <button>Buy Now</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Women Kurti</h3>
    <p class="price">₹799 <span>₹1499</span></p>
    <button>Buy Now</button>
  </div>

</div>

</body>
</html>
